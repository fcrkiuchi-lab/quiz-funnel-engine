<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
    <meta name="description" content="顧客別設定を差し替えて再利用できる診断Webアプリ">
    <title>診断Webアプリ</title>
    <link rel="stylesheet" href="diagnosis-template/styles.css">
    <script src="diagnosis-template/config.js" defer></script>
    <script src="diagnosis-template/engine.js" defer></script>
    <script src="diagnosis-template/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section id="start-screen" class="card screen" aria-labelledby="page-title">
        <div class="start-motion" aria-hidden="true">
          <svg class="shirodhara-illustration" viewBox="0 0 160 160" focusable="false">
            <path class="shirodhara-chain" d="M57 12V28M103 12V28" />
            <ellipse class="shirodhara-vessel" cx="80" cy="34" rx="34" ry="11" />
            <path class="shirodhara-vessel" d="M47 34C50 53 63 62 80 62C97 62 110 53 113 34" />
            <path class="shirodhara-oil" d="M80 63V98" />
            <circle class="shirodhara-oil-drop" cx="80" cy="103" r="3.5" />
            <path class="shirodhara-face" d="M43 144C43 117 59 96 80 96C101 96 117 117 117 144" />
            <path class="shirodhara-forehead" d="M66 106C73 101 87 101 94 106" />
          </svg>
        </div>
        <p id="start-brand" class="brand"></p>
        <p id="page-eyebrow" class="eyebrow">診断Webアプリ</p>
        <h1 id="page-title">診断Webアプリ</h1>
        <p id="page-description"></p>
        <button id="start-button" type="button">診断をはじめる</button>
      </section>

      <section id="question-screen" class="card screen" aria-labelledby="question-title" hidden>
        <div class="progress-row">
          <p id="progress-text" class="eyebrow"></p>
          <progress id="progress-bar" max="1" value="0" aria-labelledby="progress-text"></progress>
        </div>
        <form id="question-form" novalidate>
          <fieldset id="question-fieldset"></fieldset>
          <p id="form-error" class="error-message" role="alert" hidden></p>
          <div class="button-row">
            <button id="previous-button" class="secondary-button" type="button">前の質問へ</button>
            <button id="next-button" type="submit">次の質問へ</button>
          </div>
        </form>
      </section>

      <section id="result-screen" class="card screen" aria-labelledby="result-title" hidden>
        <div class="result-motion" aria-hidden="true">
          <svg class="singing-bowl-illustration" viewBox="0 0 120 120" focusable="false">
            <ellipse class="bowl-rim" cx="60" cy="47" rx="35" ry="10" />
            <path class="bowl-body" d="M25 47C28 73 40 87 60 87C80 87 92 73 95 47" />
            <path class="bowl-base" d="M45 96H75M52 87L48 96M68 87L72 96" />
            <g class="bowl-ripples">
              <ellipse cx="60" cy="103" rx="27" ry="6" />
              <ellipse cx="60" cy="111" rx="38" ry="8" />
            </g>
          </svg>
        </div>
        <p id="result-brand" class="brand"></p>
        <p class="eyebrow">結果</p>
        <h2 id="result-title" tabindex="-1">診断結果</h2>
        <p id="result-description"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">タイプ</th>
                <th scope="col">点数</th>
                <th scope="col">割合</th>
              </tr>
            </thead>
            <tbody id="result-rows"></tbody>
          </table>
        </div>
        <div id="result-texts" class="result-texts"></div>
        <p class="rounding-note">割合は小数第1位に丸めているため、表示上の合計が100.0%にならない場合があります。</p>
        <button id="restart-button" type="button">もう一度回答する</button>
      </section>
    </main>
  </body>
</html>
