<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
    <meta name="description" content="顧客別設定を差し替えて再利用できる診断Webアプリ">
    <title>診断Webアプリ</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="engine.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section id="start-screen" class="card screen" aria-labelledby="page-title">
        <div class="start-motion" aria-hidden="true">
          <span class="shirodhara-drop"></span>
        </div>
        <p id="start-brand" class="brand"></p>
        <p id="page-eyebrow" class="eyebrow">診断Webアプリ</p>
        <h1 id="page-title">診断Webアプリ</h1>
        <p id="page-description"></p>
        <button id="start-button" type="button">診断をはじめる</button>
      </section>

      <section id="question-screen" class="card screen" aria-labelledby="question-title" hidden>
        <div class="progress-row">
          <p id="progress-text" class="eyebrow"></p>
          <progress id="progress-bar" max="1" value="0" aria-labelledby="progress-text"></progress>
        </div>
        <form id="question-form" novalidate>
          <fieldset id="question-fieldset"></fieldset>
          <p id="form-error" class="error-message" role="alert" hidden></p>
          <div class="button-row">
            <button id="previous-button" class="secondary-button" type="button">前の質問へ</button>
            <button id="next-button" type="submit">次の質問へ</button>
          </div>
        </form>
      </section>

      <section id="result-screen" class="card screen" aria-labelledby="result-title" hidden>
        <div class="result-motion" aria-hidden="true">
          <span class="result-ripple"></span>
          <span class="result-flame"></span>
        </div>
        <p id="result-brand" class="brand"></p>
        <p class="eyebrow">結果</p>
        <h2 id="result-title" tabindex="-1">診断結果</h2>
        <p id="result-description"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">タイプ</th>
                <th scope="col">点数</th>
                <th scope="col">割合</th>
              </tr>
            </thead>
            <tbody id="result-rows"></tbody>
          </table>
        </div>
        <div id="result-texts" class="result-texts"></div>
        <p class="rounding-note">割合は小数第1位に丸めているため、表示上の合計が100.0%にならない場合があります。</p>
        <button id="restart-button" type="button">もう一度回答する</button>
      </section>
    </main>
  </body>
</html>
