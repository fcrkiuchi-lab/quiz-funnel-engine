<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="設定データを差し替えて再利用できる診断テンプレート">
    <title>設定差し替え型・サンプル診断</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="engine.js" defer></script>
    <script src="integration.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">診断テンプレート</p>
        <h1 id="page-title">設定差し替え型・サンプル診断</h1>
        <p id="page-description"></p>

        <form id="diagnosis-form" novalidate>
          <div id="question-list"></div>
          <p id="form-error" class="error-message" role="alert" hidden></p>
          <button type="submit">診断結果を見る</button>
        </form>
      </section>

      <section id="result" class="card result-card" aria-labelledby="result-title" hidden>
        <p class="eyebrow">結果</p>
        <h2 id="result-title" tabindex="-1">診断結果</h2>
        <p id="leader-text" class="leader-text"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">タイプ</th>
                <th scope="col">点数</th>
                <th scope="col">割合</th>
              </tr>
            </thead>
            <tbody id="result-rows"></tbody>
          </table>
        </div>
        <p class="rounding-note">割合は小数第1位に丸めているため、表示上の合計が100.0%にならない場合があります。</p>
        <p id="integration-status" class="integration-status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
